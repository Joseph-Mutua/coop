name: Sync Fork With Upstream

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 06:17 Nairobi time

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync main with upstream
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main
